    <div><label>Email</label><input id="qb-email" placeholder="guest@email.com"></div>
    <div><label>Nights</label><input id="qb-nights" type="number" value="1" min="1" oninput="qbPreview('${roomId}','${date}')"></div>
    <div><label>Payment</label><select id="qb-pay" onchange="qbPreview('${roomId}','${date}')"><option value="paid">Charge now (card)</option><option value="deposit">Deposit ${S.settings.depositPct}% now</option><option value="onsite">Pay on arrival</option></select></div>
    <div><label>Source</label><select id="qb-src"><option>phone</option><option>walk-in</option><option>direct</option></select></div>
  </div>
  <div class="d-row"><span class="k">Rate</span><span class="cream" id="qb-rate">${fmt(rateFor(room,date))} / night${season?` <span class="dim">· ${esc(season.name)} ${season.pct>0?'+':''}${season.pct}%</span>`:''}</span></div>
  <div class="d-row"><span class="k">Taxes</span><span class="dim">${S.settings.taxRates.map(t=>esc(t.name)+' '+t.pct+'%').join(' + ')||'none set'} — added to the total</span></div>
  <div id="qb-preview"></div>
  <div class="d-actions"><button class="btn solid" onclick="quickBookSave('${roomId}','${date}')">Book it</button></div>`);
  qbPreview(roomId,date);
}
/* Show the total, the tax and what is actually collected today, before the
   booking exists — not in a toast after the fact. */
function qbPreview(roomId,date){
  const el=document.getElementById('qb-preview');if(!el)return;
  const room=roomById(roomId);if(!room)return;
  const n=Math.max(1,parseInt(document.getElementById('qb-nights').value)||1);
  const pay=document.getElementById('qb-pay').value;
  const co=addDays(date,n);
  const q=priceStay(room,date,n,'');
  const due=pay==='onsite'?0:pay==='deposit'?Math.round(q.total*S.settings.depositPct/100):q.total;
  const clash=!nightsAvail(roomId,date,co);
  el.innerHTML=`
    <div class="d-row"><span class="k">Checking out</span><span>${dNice(co)}</span></div>
    <div class="d-row"><span class="k">Room · ${n} night${n>1?'s':''}</span><span>${fmtC(q.sub)}</span></div>
    ${q.taxLines.map(t=>`<div class="d-row"><span class="k">${esc(t.name)} ${t.pct}%</span><span>${fmtC(t.amt)}</span></div>`).join('')}
    <div class="d-row"><span class="k">Total</span><span class="cream">${fmtC(q.total)}</span></div>
    <div class="d-row"><span class="k">Collected now</span><span class="${due?'gold':'dim'}">${due?fmtC(due):'nothing — card held only'}</span></div>
    ${clash?`<div class="micro" style="color:var(--bad);margin-top:10px">Those nights aren't all free — shorten the stay or pick another room.</div>`:''}`;
  const btn=el.parentElement.querySelector('.d-actions .btn');
  if(btn){btn.disabled=clash;btn.style.opacity=clash?.45:1;btn.style.pointerEvents=clash?'none':''}
}
function quickBookSave(roomId,date){
  const room=roomById(roomId);const n=Math.max(1,parseInt(document.getElementById('qb-nights').value)||1);
  const name=document.getElementById('qb-name').value.trim()||'Unnamed guest';
  const co=addDays(date,n);
  if(!nightsAvail(roomId,date,co)){toast('Conflict','Some of those nights are taken or closed.');return}
  const res=bookingFrom({room,ci:date,co,guest:name,
    email:document.getElementById('qb-email').value.trim(),
    phone:document.getElementById('qb-phone').value.trim(),
    payment:document.getElementById('qb-pay').value,
    source:document.getElementById('qb-src').value,
    quote:priceStay(room,date,n,'')});
  S.reservations.push(res);postBookingTxns(res);
  save();closeDrawer();renderAll();toast('Booked',name+' · '+room.num+' · '+n+' night'+(n>1?'s':'')+' · '+fmtC(res.total));
  if(S.settings.notifs.newBooking)toast('Notification','Owner notified · guest confirmation sent.');
}
function newResQuick(){
  const open=S.rooms.find(r=>r.open);
  if(!open){toast('No rooms open','Reopen a room in Rooms & Rates before booking one.');return}
  quickBook(open.id,today());
}
</script>
<script>
/* ============ RESERVATIONS ============ */
let resFilter='upcoming', resQuery='';
function setResQuery(v){resQuery=v;keepFocus(renderReservations)}
function matchesRes(r,q){
  if(!q)return true;
  const room=roomById(r.roomId);
  return [r.id,r.guest,r.email,r.phone,r.source,room&&room.num,room&&room.name]
    .filter(Boolean).join(' ').toLowerCase().includes(q);
}
function renderReservations(){
  const q=resQuery.trim().toLowerCase();
  const list=S.reservations.filter(r=>{
    if(!matchesRes(r,q))return false;
    if(resFilter==='upcoming')return r.status!=='cancelled'&&r.checkout>=today();
    if(resFilter==='past')return r.checkout<today()&&r.status!=='cancelled';
    if(resFilter==='cancelled')return r.status==='cancelled';
    return true});
  document.getElementById('p-reservations').innerHTML=`
  <div class="sec-head"><div><h2>Reservations</h2><div class="sub">${list.length} shown${q?' matching "'+esc(resQuery)+'"':''} · every booking lands here whether it came from the site, the phone, or the walk-up.</div></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <div class="searchbox"><input id="res-q" type="search" placeholder="Name, room, ref, email…" value="${esc(resQuery)}" aria-label="Search reservations" oninput="setResQuery(this.value)"></div>
  <div class="view-toggle">
    ${['upcoming','past','cancelled','all'].map(f=>`<button class="${resFilter===f?'on':''}" onclick="resFilter='${f}';renderReservations()">${f}</button>`).join('')}
  </div></div></div>
  <table class="data"><thead><tr><th>Ref</th><th>Guest</th><th>Room</th><th>Dates</th><th>Nights</th><th>Total</th><th>Payment</th><th>Source</th><th>Stay</th><th></th></tr></thead>
  <tbody>${list.length?list.map(r=>{const room=roomById(r.roomId);return `<tr>
    <td class="dim">${esc(r.id)}</td><td class="cream">${esc(r.guest)}</td><td>${esc(room?room.num:'—')}</td>
    <td>${dNice(r.checkin)} → ${dNice(r.checkout)}</td><td>${r.nights}</td>
    <td>${fmtC(r.total)}</td>
    <td>${r.status==='cancelled'?'<span class="pill closed">Cancelled</span>':`<span class="pill ${r.payment}">${r.payment==='paid'?'Paid':r.payment==='deposit'?'Deposit':'On arrival'}</span>`}</td>
    <td class="dim">${esc(r.source)}</td>
    <td class="dim">${STATE_LABEL[stayState(r)]}</td>
    <td><button class="btn ghost sm" onclick="openRes('${r.id}')">Open</button></td></tr>`}).join(''):`<tr><td colspan="10" class="dim" style="text-align:center;padding:34px">${q?'Nothing matches “'+esc(resQuery)+'”.':"Nothing here. Quiet is fine — it means the OTAs aren't eating either."}</td></tr>`}
  </tbody></table>`;
}

/* ============ ROOMS & RATES ============ */
function renderRooms(){
  document.getElementById('p-rooms').innerHTML=`
  <div class="sec-head"><div><h2>Rooms &amp; Rates</h2><div class="sub">Edit in place. Add a room, change a rate, close a unit — no save button, no second screen. It just applies.</div></div>
  <button class="btn solid" onclick="addRoom()">+ Add room</button></div>
  <div class="rooms-grid">
    ${S.rooms.map(r=>`<div class="room-card ${r.open?'':'is-closed'}">
      <div class="rh"><span class="rn">${esc(r.num)} · ${esc(r.name)}</span>
        <div style="display:flex;align-items:center;gap:8px"><span class="micro">${r.open?'Open':'Closed'}</span><div class="switch ${r.open?'on':''}" onclick="toggleRoom('${r.id}')"></div></div></div>
      <div class="rtype">${esc(r.type)}</div>
      <div class="room-rate-row"><label style="margin:0">Base rate</label><input type="number" value="${r.rate}" onchange="setRate('${r.id}',this.value)"><span class="dim">/ night</span></div>
      <div class="micro" style="margin-bottom:10px">Tonight: <span class="gold">${fmt(rateFor(r,today()))}</span> after multipliers</div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost sm" onclick="editRoom('${r.id}')">Edit</button>
        <button class="btn ghost sm danger" onclick="delRoom('${r.id}')">Remove</button>
      </div>
    </div>`).join('')}
  </div>

  <div style="height:26px"></div>
  <div class="block"><h3>Seasonal rate multipliers</h3><div class="bsub">Raise or lower every rate for a date range. Peak season up, shoulder season down — the guest page recalculates instantly.</div>
    <table class="data"><thead><tr><th>Name</th><th>From</th><th>To</th><th>Adjustment</th><th></th></tr></thead><tbody>
    ${S.multipliers.map(m=>`<tr><td class="cream">${esc(m.name)}</td><td>${dNice(m.from)}</td><td>${dNice(m.to)}</td><td><span class="pill ${m.pct>=0?'paid':'closed'}">${m.pct>=0?'+':''}${m.pct}%</span></td><td><button class="btn ghost sm danger" onclick="S.multipliers=S.multipliers.filter(x=>x.id!=='${m.id}');save();renderAll()">Remove</button></td></tr>`).join('')||'<tr><td colspan="5" class="dim">None set.</td></tr>'}
    </tbody></table>
    <div class="inline-row" style="margin-top:16px">
      <div><label>Name</label><input id="mul-name" placeholder="Summer peak"></div>
      <div><label>From</label><input id="mul-from" type="date" value="${today()}"></div>
      <div><label>To</label><input id="mul-to" type="date" value="${addDays(today(),30)}"></div>
      <div><label>± %</label><input id="mul-pct" type="number" value="15"></div>
      <button class="btn" onclick="addMultiplier()">Add</button>
    </div>
  </div>

  <div class="block"><h3>Promo codes</h3><div class="bsub">For returning guests, email offers, and ads — code entered on the booking page.</div>
    ${S.promos.map(p=>`<span class="chip">${esc(p.code)} · −${p.pct}%<button onclick="S.promos=S.promos.filter(x=>x.id!=='${p.id}');save();renderAll()">×</button></span>`).join('')}
    <div class="inline-row" style="margin-top:10px">
      <div><label>Code</label><input id="promo-code" placeholder="DIRECT10"></div>
      <div><label>Discount %</label><input id="promo-pct" type="number" value="10"></div>
      <button class="btn" onclick="addPromo()">Add code</button>
    </div>
  </div>

  <div class="block"><h3>Extras</h3><div class="bsub">Add-ons guests can tick at checkout — pet fees, firewood, late checkout.</div>
    ${S.extras.map(e=>`<span class="chip">${esc(e.name)} · ${fmt(e.amt)}<button onclick="S.extras=S.extras.filter(x=>x.id!=='${e.id}');save();renderAll()">×</button></span>`).join('')}
    <div class="inline-row" style="margin-top:10px">
      <div><label>Extra</label><input id="ex-name" placeholder="Pet fee"></div>
      <div><label>Amount</label><input id="ex-amt" type="number" value="25"></div>
      <button class="btn" onclick="addExtra()">Add extra</button>
    </div>
  </div>`;
}
function toggleRoom(id){const r=roomById(id);r.open=!r.open;save();renderAll();toast(r.open?'Room open':'Room closed',r.num+' · '+r.name)}
function setRate(id,v){const r=roomById(id);r.rate=Math.max(1,parseInt(v)||r.rate);save();renderAll();toast('Rate updated',r.num+' now '+fmt(r.rate)+'/night base.')}
function addRoom(){const n=S.rooms.length;S.rooms.push({id:'r'+Date.now(),num:String(100+n+1),name:'New Room',type:'Queen · sleeps 2',rate:129,open:true});save();renderAll();toast('Room added','Rename it and set the rate in place.')}
function editRoom(id){const r=roomById(id);if(!r)return;
  openDrawer(`<div class="micro">Edit room</div><h3>${esc(r.num)} · ${esc(r.name)}</h3><div class="dsub">&nbsp;</div>
  <div class="form-grid">
    <div><label>Room number</label><input id="er-num" value="${esc(r.num)}"></div>
    <div><label>Name</label><input id="er-name" value="${esc(r.name)}"></div>
    <div><label>Type line</label><input id="er-type" value="${esc(r.type)}"></div>
  </div>
  <div class="d-actions"><button class="btn solid" onclick="const r=roomById('${id}');r.num=document.getElementById('er-num').value;r.name=document.getElementById('er-name').value;r.type=document.getElementById('er-type').value;save();closeDrawer();renderAll();toast('Saved','Room details updated.')">Save</button></div>`)}
function delRoom(id){const r=roomById(id);if(S.reservations.some(x=>x.roomId===id&&x.status!=='cancelled'&&x.checkout>=today())){toast('Room has bookings','Cancel or move upcoming stays before removing it.');return}
  S.rooms=S.rooms.filter(x=>x.id!==id);save();renderAll();toast('Room removed',r.num+' · '+r.name)}
function addMultiplier(){const name=document.getElementById('mul-name').value||'Season';S.multipliers.push({id:'m'+Date.now(),name,from:document.getElementById('mul-from').value,to:document.getElementById('mul-to').value,pct:parseInt(document.getElementById('mul-pct').value)||0});save();renderAll();toast('Multiplier added',name)}
function addPromo(){const c=(document.getElementById('promo-code').value||'').toUpperCase().trim();if(!c)return;S.promos.push({id:'p'+Date.now(),code:c,pct:parseInt(document.getElementById('promo-pct').value)||0});save();renderAll();toast('Promo code live',c)}
function addExtra(){const n=document.getElementById('ex-name').value.trim();if(!n)return;S.extras.push({id:'e'+Date.now(),name:n,amt:parseInt(document.getElementById('ex-amt').value)||0});save();renderAll();toast('Extra added',n)}

/* ============ PAYMENTS ============ */
function renderPayments(){
  /* The ledger is the source of truth. Rows are appended when money actually
     moves and are never rewritten, so charging a balance no longer erases the
     deposit that came before it. */
  const txns=S.txns.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  const gross=txns.filter(t=>t.amt>0).reduce((a,t)=>a+t.amt,0);
  const refunded=txns.filter(t=>t.amt<0).reduce((a,t)=>a+t.amt,0);
  const collected=gross+refunded;
  const outstanding=S.reservations.filter(r=>r.status!=='cancelled').reduce((a,r)=>a+balanceFor(r),0);
  /* Stripe: 2.9% + 30¢ per successful charge, and the fee is not returned on a
     refund. Everything here is in cents so the percentage and the flat fee are
     in the same unit — the old line mixed dollars with cents and reported
     roughly a thirtieth of the real cost. */
  const captures=txns.filter(t=>t.amt>0);
  const fees=captures.reduce((a,t)=>a+Math.round(t.amt*0.029)+30,0);
  document.getElementById('p-payments').innerHTML=`
  <div class="sec-head"><div><h2>Payments</h2><div class="sub">Money goes straight to the property's own Stripe account. The Continental never holds funds.</div></div>
  <button class="btn" onclick="exportPayments()">Export CSV</button></div>
  <div class="stats">
    <div class="stat"><div class="micro">Net collected</div><div class="v">${fmtCr(collected)}</div><div class="d">${fmtCr(gross)} in${refunded?' · '+fmtCr(-refunded)+' refunded':''}</div></div>
    <div class="stat"><div class="micro">Due on arrival</div><div class="v">${fmtCr(outstanding)}</div></div>
    <div class="stat"><div class="micro">Processing fees (est.)</div><div class="v">${fmtC(fees)}</div><div class="d">2.9% + 30¢ × ${captures.length}</div></div>
    <div class="stat"><div class="micro">Stripe</div><div class="v" style="font-size:15px;letter-spacing:.1em">${S.settings.stripeConnected?'<span class="gold">CONNECTED</span>':'NOT CONNECTED'}</div><div class="d">payouts daily → property bank</div></div>
  </div>
  <table class="data"><thead><tr><th>Date</th><th>Description</th><th>Ref</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead><tbody>
  ${txns.length?txns.map(t=>`<tr><td class="dim">${dNice(t.date)}</td><td class="cream">${esc(t.desc)}</td><td class="dim">${esc(t.resId)}</td>
    <td style="text-align:right;${t.amt<0?'color:#d89890':''}">${t.amt<0?'−':''}${fmtC(Math.abs(t.amt))}</td>
    <td>${t.type==='refund'?'<span class="pill refund">Refunded</span>':t.type==='forfeit'?'<span class="pill closed">Retained</span>':t.type==='deposit'?'<span class="pill deposit">Deposit</span>':'<span class="pill paid">Settled</span>'}</td></tr>`).join(''):`<tr><td colspan="5" class="dim" style="text-align:center;padding:34px">No money has moved yet.</td></tr>`}
  </tbody></table>
  ${outstanding?`<div class="micro" style="margin-top:14px">Pay-on-arrival balances are not in this ledger — nothing has been charged yet. They appear the moment the card is run.</div>`:''}`;
}
function exportPayments(){
  const rows=S.txns.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
    const r=S.reservations.find(x=>x.id===t.resId)||{};
    const fee=t.amt>0?(Math.round(t.amt*0.029)+30):0;
    return [t.id,t.date,t.type,t.resId,r.guest||'',(t.amt/100).toFixed(2),(fee/100).toFixed(2),((t.amt-fee)/100).toFixed(2),t.desc];
  });
  downloadCSV('continental-ledger-'+today()+'.csv',['txn_id','date','type','reservation','guest','amount','stripe_fee_est','net','description'],rows);
}
</script>
<script>
/* ============ REPORTS ============ */
function monthKey(d){return d.slice(0,7)}
function renderReports(){
  const valid=S.reservations.filter(r=>r.status!=='cancelled');
  const rev=valid.reduce((a,r)=>a+r.total,0);
  const roomRev=valid.reduce((a,r)=>a+((r.roomSubtotal||0)-(r.discount||0)),0);
  const nightCount=valid.reduce((a,r)=>a+r.nights,0);
  const adr=nightCount?Math.round(roomRev/nightCount):0;
  /* Tax comes off each booking's own snapshot. Deriving it from today's
     settings made every historical report change whenever a rate was edited. */
  const taxAmt=valid.reduce((a,r)=>a+(r.taxTotal||0),0);
  const taxTotal=S.settings.taxRates.reduce((a,t)=>a+(Number(t.pct)||0),0);
  const byMonth={};valid.forEach(r=>{const k=monthKey(r.checkin);byMonth[k]=(byMonth[k]||0)+r.total});
  document.getElementById('p-reports').innerHTML=`
  <div class="sec-head"><div><h2>Reports</h2><div class="sub">Every report downloads as CSV — hand them straight to the accountant.</div></div></div>
  <div class="savings-banner">
    <div><div class="micro" style="color:var(--gold)">Commission you did not pay the OTAs</div><div class="amt">${fmtCr(rev*.12)}</div></div>
    <div style="text-align:right;font-size:12px;color:var(--ink-dim);max-width:380px">At a 12% OTA commission on ${fmtCr(rev)} of direct bookings. Every dollar above the line stays with the property — that is the whole point of this system.</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="micro">Gross revenue</div><div class="v">${fmtCr(rev)}</div></div>
    <div class="stat"><div class="micro">Nights sold</div><div class="v">${nightCount}</div></div>
    <div class="stat"><div class="micro">ADR</div><div class="v">${fmtCr(adr)}</div><div class="d">room revenue ÷ nights</div></div>
    <div class="stat"><div class="micro">Tax collected</div><div class="v">${fmtC(taxAmt)}</div><div class="d">snapshotted at booking · ${taxTotal}% today</div></div>
  </div>
  <div class="rep-grid">
    <div class="rep-card"><h3>Reconciliation</h3><p>Charges, refunds, on-arrival balances and Stripe payout matching for any period.</p><button class="btn" onclick="repRecon()">Download CSV</button></div>
    <div class="rep-card"><h3>Finance summary</h3><p>Revenue by month, ADR, nights sold, occupancy — the numbers for the monthly call.</p><button class="btn" onclick="repFinance()">Download CSV</button></div>
    <div class="rep-card"><h3>Tax report</h3><p>Tax collected per booking, split by rate (${S.settings.taxRates.map(t=>esc(t.name)+' '+t.pct+'%').join(', ')||'none set'}), ready for filing.</p><button class="btn" onclick="repTax()">Download CSV</button></div>
    <div class="rep-card"><h3>Occupancy</h3><p>Room-nights sold vs available, per room, per day.</p><button class="btn" onclick="repOcc()">Download CSV</button></div>
    <div class="rep-card"><h3>Guest ledger</h3><p>Every guest, every stay, lifetime value — the list the OTA never lets you keep.</p><button class="btn" onclick="repGuests()">Download CSV</button></div>
    <div class="rep-card"><h3>Revenue by month</h3><p>${Object.keys(byMonth).length?Object.entries(byMonth).sort().map(([k,v])=>k+': '+fmtCr(v)).join(' · '):'No data yet.'}</p><button class="btn" onclick="repFinance()">Download CSV</button></div>
  </div>`;
}
function repRecon(){
  const rows=S.reservations.map(r=>{
    const col=collectedFor(r.id),fee=txnsFor(r.id).filter(t=>t.amt>0).reduce((a,t)=>a+Math.round(t.amt*0.029)+30,0);
    return [r.id,r.guest,r.checkin,r.checkout,(r.total/100).toFixed(2),(col/100).toFixed(2),(balanceFor(r)/100).toFixed(2),(fee/100).toFixed(2),((col-fee)/100).toFixed(2),r.payment,r.status];
  });
  downloadCSV('continental-reconciliation-'+today()+'.csv',['ref','guest','checkin','checkout','total','collected','balance','stripe_fee_est','net_to_bank','method','status'],rows);
}
function repFinance(){
  const byMonth={};
  S.reservations.filter(r=>r.status!=='cancelled').forEach(r=>{const k=monthKey(r.checkin);byMonth[k]=byMonth[k]||{rev:0,room:0,nights:0,res:0};byMonth[k].rev+=r.total;byMonth[k].room+=(r.roomSubtotal||0)-(r.discount||0);byMonth[k].nights+=r.nights;byMonth[k].res++});
  const rows=Object.entries(byMonth).sort().map(([k,v])=>[k,v.res,v.nights,(v.rev/100).toFixed(2),(v.room/100).toFixed(2),v.nights?(v.room/v.nights/100).toFixed(2):'0.00']);
  downloadCSV('continental-finance-'+today()+'.csv',['month','reservations','nights_sold','revenue_all_in','room_revenue','adr'],rows);
}
function repTax(){
  /* Each line is the tax that was actually quoted on that booking, per rate. */
  const rows=[];
  S.reservations.filter(r=>r.status!=='cancelled').forEach(r=>{
    (r.taxLines&&r.taxLines.length?r.taxLines:[{name:'—',pct:0,amt:0}]).forEach(t=>{
      rows.push([r.id,r.guest,r.checkin,(((r.roomSubtotal||0)-(r.discount||0))/100).toFixed(2),t.name,t.pct+'%',((t.amt||0)/100).toFixed(2),(r.total/100).toFixed(2)]);
    });
  });
  downloadCSV('continental-tax-'+today()+'.csv',['ref','guest','checkin','taxable_base','tax_name','rate','tax_collected','booking_total'],rows);
}
function repOcc(){const rows=[];for(let i=-14;i<14;i++){const d=addDays(today(),i);const open=S.rooms.filter(r=>r.open).length;const sold=S.rooms.filter(r=>r.open&&resOn(r.id,d).length).length;rows.push([d,open,sold,open?Math.round(sold/open*100)+'%':'—'])}downloadCSV('continental-occupancy-'+today()+'.csv',['date','rooms_open','rooms_sold','occupancy'],rows)}
function repGuests(){const rows=S.reservations.map(r=>[r.guest,r.email,r.phone,r.checkin,(r.total/100).toFixed(2),r.source,r.status]);downloadCSV('continental-guest-ledger-'+today()+'.csv',['guest','email','phone','checkin','total','source','status'],rows)}

/* ============ GUESTS ============ */
let guestQuery='';
function setGuestQuery(v){guestQuery=v;keepFocus(renderGuests)}
function renderGuests(){
  const gq=guestQuery.trim().toLowerCase();
  const map={};
  S.reservations.filter(r=>r.status!=='cancelled').forEach(r=>{const k=r.guest;map[k]=map[k]||{stays:0,total:0,email:r.email,phone:r.phone,last:r.checkin,payment:r.payment};map[k].stays++;map[k].total+=r.total;if(r.checkin>map[k].last)map[k].last=r.checkin});
  const rows=Object.entries(map)
    .filter(([name,g])=>!gq||(name+' '+(g.email||'')+' '+(g.phone||'')).toLowerCase().includes(gq))
    .sort((a,b)=>b[1].total-a[1].total);
  document.getElementById('p-guests').innerHTML=`
  <div class="sec-head"><div><h2>Guests</h2><div class="sub">${rows.length} guest${rows.length===1?'':'s'} · the guest list is the asset. On the OTAs it belonged to them; here it belongs to the property.</div></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div class="searchbox"><input id="g-q" type="search" placeholder="Search guests…" value="${esc(guestQuery)}" aria-label="Search guests" oninput="setGuestQuery(this.value)"></div>
    <button class="btn" onclick="repGuests()">Export CSV</button>
  </div></div>
  <table class="data"><thead><tr><th>Guest</th><th>Contact</th><th>Stays</th><th>Last stay</th><th>Lifetime value</th><th>Card</th></tr></thead><tbody>
  ${rows.length?rows.map(([name,g])=>`<tr><td class="cream">${esc(name)}</td><td class="dim">${esc(g.email)}<br>${esc(g.phone)}</td><td>${g.stays}</td><td>${dNice(g.last)}</td><td class="gold">${fmtCr(g.total)}</td><td>${g.payment==='onsite'?'<span class="pill onsite">On file</span>':'<span class="pill paid">On file</span>'}</td></tr>`).join(''):`<tr><td colspan="6" class="dim" style="text-align:center;padding:34px">${gq?'Nobody matches “'+esc(guestQuery)+'”.':'No guests yet.'}</td></tr>`}
  </tbody></table>`;
}

/* ============ SETUP ============ */
function renderSetup(){
  const s=S.settings;
  document.getElementById('p-setup').innerHTML=`
  <div class="sec-head"><div><h2>Setup</h2><div class="sub">Everything about the property, in one place. Changes apply to the booking page immediately.</div></div></div>
  <div class="setup-grid">
    <div class="block"><h3>Property</h3><div class="bsub">Name, location, and the look of the booking page.</div>
      <div class="form-grid">
        <div><label>Property name</label><input id="s-name" value="${esc(s.propertyName)}" onchange="S.settings.propertyName=this.value;document.getElementById('hdrPropName').textContent=this.value;save()"></div>
        <div><label>City</label><input value="${esc(s.city)}" onchange="S.settings.city=this.value;save()"></div>
      </div>
      <div class="tog-row" style="margin-top:14px"><div>Day desk<div class="desc">Light back office for a bright front desk. The guest page stays dark either way.</div></div><div class="switch ${s.deskMode==='day'?'on':''}" onclick="setDeskMode(S.settings.deskMode==='day'?'night':'day')"></div></div>
      <label style="margin-top:16px">Theme — matched to the property's brand</label>
      <div class="swatches">${Object.entries(THEMES).map(([k,t])=>`<div class="swopt ${s.theme===k?'sel':''}" title="${k}" style="background:linear-gradient(135deg,${t.bg} 55%,${t.gold} 55%)" onclick="S.settings.theme='${k}';save();applyTheme();renderSetup()"></div>`).join('')}</div>
      <div class="micro" style="margin-top:10px">Pick a palette — the whole app and the guest page re-skin instantly.</div>
    </div>

    <div class="block"><h3>Taxes &amp; accounting</h3><div class="bsub">Rates are collected inside the booking total and broken out on the tax report.</div>
      ${s.taxRates.map((t,i)=>`<div class="inline-row" style="margin-bottom:10px"><div><label>Tax name</label><input value="${esc(t.name)}" onchange="S.settings.taxRates[${i}].name=this.value;save()"></div><div><label>%</label><input type="number" step="0.01" value="${t.pct}" onchange="S.settings.taxRates[${i}].pct=parseFloat(this.value)||0;save()"></div><button class="btn ghost sm danger" aria-label="Remove ${esc(t.name)}" onclick="S.settings.taxRates.splice(${i},1);save();renderSetup()">Remove</button></div>`).join('')||'<div class="micro">No tax lines — bookings are quoted tax-free.</div>'}
      <div class="micro" style="margin:4px 0 12px">Changing a rate only affects new bookings. Existing stays keep the tax they were quoted.</div>
      <button class="btn sm" onclick="S.settings.taxRates.push({name:'New tax',pct:5});save();renderSetup()">+ Add tax line</button>
    </div>

    <div class="block"><h3>Payment methods</h3><div class="bsub">How guests can pay. Stripe handles the card side — numbers never touch this system.</div>
      <div class="tog-row"><div>Charge card at booking<div class="desc">Full amount via Stripe at checkout.</div></div><div class="switch on" style="pointer-events:none"></div></div>
      <div class="tog-row"><div>Deposit at booking<div class="desc">Charge ${s.depositPct}% now, rest on arrival.</div></div><div style="display:flex;align-items:center;gap:8px"><input style="width:64px;text-align:right" type="number" value="${s.depositPct}" onchange="S.settings.depositPct=parseInt(this.value)||30;save()"><span class="dim">%</span></div></div>
      <div class="tog-row"><div>Pay on arrival<div class="desc">Card saved as security, charged at the desk.</div></div><div class="switch ${s.payOnSite?'on':''}" onclick="S.settings.payOnSite=!S.settings.payOnSite;save();renderSetup()"></div></div>
      <div class="tog-row"><div>Stripe account<div class="desc">Payouts land in the property's bank daily.</div></div><span class="pill ${s.stripeConnected?'paid':'closed'}">${s.stripeConnected?'Connected':'Not connected'}</span></div>
    </div>

    <div class="block"><h3>Policies</h3><div class="bsub">Shown on the booking page and in the confirmation email. This is also the legal cover for charging a saved card.</div>
      <label>Cancellation &amp; damage policy</label>
      <textarea rows="5" onchange="S.settings.cancellation=this.value;save()">${esc(s.cancellation)}</textarea>
    </div>

    <div class="block"><h3>Notifications</h3><div class="bsub">Who hears about what, the moment it happens.</div>
      ${[['newBooking','New booking','Email + SMS to owner, confirmation to guest'],['cancellation','Cancellation','Alert the moment a stay cancels'],['paymentFail','Payment failure','Flag a declined card before arrival day'],['dailySummary','Daily summary','One morning email: arrivals, departures, revenue'],['reviewNudge','Post-checkout review request','Asks happy guests for a Google review 24h after checkout']].map(([k,t,d])=>`
      <div class="tog-row"><div>${t}<div class="desc">${d}</div></div><div class="switch ${s.notifs[k]?'on':''}" onclick="S.settings.notifs.${k}=!S.settings.notifs.${k};save();renderSetup()"></div></div>`).join('')}
    </div>

    <div class="block"><h3>Promotion · meta channels</h3><div class="bsub">Not OTAs — these are billboards that send guests to <em>your</em> page. Lobby Lamp runs these as a service; the property pays a fraction of the commission it used to lose.</div>
      ${[['google','Google Hotel Ads','Live · links point to the direct page'],['trivago','Trivago','Live · free booking link + sponsored'],['tripadvisor','TripAdvisor','Business Advantage listing']].map(([k,t,d])=>`
      <div class="metric-ch"><div><div class="ch-name">${t}</div><div class="ch-sub">${d}</div></div><div class="switch ${s.channels[k].on?'on':''}" onclick="S.settings.channels.${k}.on=!S.settings.channels.${k}.on;save();renderSetup();toast('${t}',S.settings.channels.${k}.on?'Campaign connected.':'Campaign paused.')"></div></div>`).join('')}
      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
        <div class="micro" style="color:var(--gold);margin-bottom:8px">Last 30 days · Google Hotel Ads</div>
        <div class="d-row"><span class="k">Impressions</span><span>1,200</span></div>
        <div class="d-row"><span class="k">Clicks</span><span>63</span></div>
        <div class="d-row"><span class="k">Reservations</span><span>8</span></div>
        <div class="d-row"><span class="k">Conversion</span><span>12.7%</span></div>
        <div class="d-row"><span class="k">Booked value</span><span class="cream">$1,070</span></div>
        <div class="d-row"><span class="k">OTA commission avoided (12%)</span><span class="gold">$128</span></div>
        <div class="d-row"><span class="k">Lobby Lamp share (4%)</span><span>$43</span></div>
      </div>
    </div>
  </div>`;
}
</script>
<script>
/* ============ GUEST BOOKING PAGE — one page, no steps ============ */
const sleepsRx=/sleeps\s*(\d+)/i;
function sleeps(r){const m=sleepsRx.exec(r.type||'');return m?parseInt(m[1]):99}
function setStay(ci,co){
  if(ci){G.ci=ci;if(G.co<=G.ci)G.co=addDays(G.ci,1)}
  if(co){G.co=co<=G.ci?addDays(G.ci,1):co}
  G.roomId=null;renderGuest();
}
function pickRoom(id){
  const first=!G.roomId;G.roomId=id;renderGuest();
  if(first)document.getElementById('gSummary')?.scrollIntoView({behavior:'smooth',block:'start'});
}
const G0=()=>({ci:today(),co:addDays(today(),2),guests:2,roomId:null,pay:'paid',promo:'',name:'',email:'',phone:'',confirmed:null});
let G=G0();
/* The summary re-renders whenever the guest picks an option, so anything they
   have already typed lives in G — not in the DOM — and the caret goes back
   where it was. Losing a half-typed email to a click on "pay at the property"
   is the kind of friction that costs the booking. */
function keepFocus(fn){
  const a=document.activeElement,id=a&&a.id,st=a&&a.selectionStart,en=a&&a.selectionEnd;
  fn();
  if(!id)return;
  const b=document.getElementById(id);
  if(!b||b===document.activeElement)return;
  b.focus({preventScroll:true});
  try{if(st!=null&&b.setSelectionRange)b.setSelectionRange(st,en)}catch(e){}
}
function gSet(k,v){G[k]=v;keepFocus(renderGuest)}
function renderGuest(){
  const s=S.settings;
  const wrap=document.getElementById('gWrap');
  if(G.confirmed){wrap.innerHTML=confirmHTML();a11yUpgrade(wrap);return}
  const n=Math.max(1,nights(G.ci,G.co));
  const freeRooms=S.rooms.filter(r=>r.open&&nightsAvail(r.id,G.ci,G.co));
  const avail=freeRooms.filter(r=>sleeps(r)>=G.guests);
  const tooSmall=freeRooms.length-avail.length;
  if(G.roomId&&!avail.some(r=>r.id===G.roomId))G.roomId=null;
  wrap.innerHTML=`
  <div class="g-hero">
    <div class="over">Direct booking · no middleman</div>
    <h1>${esc(s.propertyName)}</h1>
    <p>${esc(s.city)} · <span class="serif-it" style="font-size:15px;color:var(--cream)">Book here and the property keeps 100% — that's why the best rate lives on this page.</span></p>
  </div>
  <div class="ticker">Best rate on this page — guaranteed <i>◆</i> No booking fees <i>◆</i> You are booking directly with the property</div>
  <div class="g-bookbar">
    <div><label>Check-in</label><input type="date" value="${G.ci}" min="${today()}" onchange="setStay(this.value,null)"></div>
    <div><label>Check-out</label><input type="date" value="${G.co}" min="${addDays(G.ci,1)}" onchange="setStay(null,this.value)"></div>
    <div><label>Guests</label><select onchange="G.guests=parseInt(this.value)||1;renderGuest()">${[1,2,3,4,5,6].map(x=>`<option ${G.guests==x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><button class="btn solid" onclick="renderGuest()">Search</button></div>
  </div>
  <div class="micro" style="margin-bottom:14px">${avail.length} room${avail.length===1?'':'s'} available · ${n} night${n>1?'s':''}</div>
  ${avail.length?avail.map(r=>{
    const q=priceStay(r,G.ci,n,G.promo);
    return `<div class="g-room ${G.roomId===r.id?'sel':''}" onclick="pickRoom('${r.id}')">
      <div class="thumb">${esc(r.num)}</div>
      <div class="rbody"><h3>${esc(r.name)}</h3><p>${esc(r.type)}</p>
        <div class="ramen"><span>Free Wi-Fi</span><span>Free parking</span><span>Pet friendly</span></div></div>
      <div class="rprice"><div class="p">${fmtCr(q.total)}</div><div class="per">${n} night${n>1?'s':''} · all-in</div></div>
    </div>`}).join(''):(tooSmall
    ? `<div class="g-confirm"><h3 style="letter-spacing:.12em;text-transform:uppercase;color:var(--cream)">Nothing that sleeps ${G.guests}</h3><p class="dim" style="margin-top:10px">${tooSmall} room${tooSmall>1?'s are':' is'} free those nights but too small for your party. Try fewer guests, different dates, or call the desk about a second room.</p></div>`
    : `<div class="g-confirm"><h3 style="letter-spacing:.12em;text-transform:uppercase;color:var(--cream)">Nothing open those nights</h3><p class="dim" style="margin-top:10px">Try different dates — or call the desk, sometimes there's a cancellation.</p></div>`)}
  ${G.roomId?guestSummaryHTML(n):''}`;
  a11yUpgrade(wrap);
}
function guestSummaryHTML(n){
  const r=roomById(G.roomId);const s=S.settings;
  const q=priceStay(r,G.ci,n,G.promo);
  const {sub,promo,disc,tax,total}=q;
  const dep=G.pay==='onsite'?0:G.pay==='deposit'?Math.round(total*s.depositPct/100):total;
  return `<div class="g-summary" id="gSummary">
    <h3>Your stay</h3>
    <div class="deco" style="margin:0 0 16px"><span style="font-size:8px">◆</span></div>
    <div class="sum-row"><span>${esc(r.num)} · ${esc(r.name)}</span><span>${dNice(G.ci)} → ${dNice(G.co)}</span></div>
    <div class="sum-row"><span>Room · ${n} night${n>1?'s':''}</span><span>${fmtC(sub)}</span></div>
    ${disc?`<div class="sum-row"><span>Promo ${esc(promo.code)}</span><span class="gold">−${fmtC(disc)}</span></div>`:''}
    ${q.taxLines.map(t=>`<div class="sum-row"><span>${esc(t.name)} ${t.pct}%</span><span>${fmtC(t.amt)}</span></div>`).join('')||`<div class="sum-row"><span>Taxes</span><span>${fmtC(tax)}</span></div>`}
    <div style="display:flex;gap:10px;margin:14px 0"><input id="g-promo" placeholder="Promo code" value="${esc(G.promo)}" oninput="G.promo=this.value" onchange="gSet('promo',this.value)"><button class="btn ghost sm" onclick="gSet('promo',document.getElementById('g-promo').value)">Apply</button></div>
    ${G.promo.trim()&&!promo?`<div class="micro" style="color:var(--warn);margin:-6px 0 12px">That code isn't recognised — the rate above is unchanged.</div>`:''}
    <div class="form-grid" style="margin:18px 0 6px">
      <div><label>Full name</label><input id="g-name" placeholder="Your name" value="${esc(G.name)}" oninput="G.name=this.value"></div>
      <div><label>Email</label><input id="g-email" type="email" placeholder="you@email.com" value="${esc(G.email)}" oninput="G.email=this.value"></div>
      <div><label>Phone</label><input id="g-phone" type="tel" placeholder="(___) ___-____" value="${esc(G.phone)}" oninput="G.phone=this.value"></div>
    </div>
    <div class="pay-opts">
      <div class="pay-opt ${G.pay==='paid'?'sel':''}" onclick="gSet('pay','paid')"><div class="t">Pay now · ${fmtC(total)}</div><div class="d">Card charged securely by Stripe. Done in one click.</div></div>
      ${s.depositPct>0?`<div class="pay-opt ${G.pay==='deposit'?'sel':''}" onclick="gSet('pay','deposit')"><div class="t">Deposit · ${fmtC(Math.round(total*s.depositPct/100))}</div><div class="d">${s.depositPct}% now, ${fmtC(total-Math.round(total*s.depositPct/100))} on arrival.</div></div>`:''}
      ${s.payOnSite?`<div class="pay-opt ${G.pay==='onsite'?'sel':''}" onclick="gSet('pay','onsite')"><div class="t">Pay at the property</div><div class="d">Card saved as security only — nothing charged until you arrive.</div></div>`:''}
    </div>
    <div class="sum-row total"><span>Due ${G.pay==='onsite'?'on arrival':'today'}</span><span>${fmtC(dep)}</span></div>
    ${G.pay!=='paid'?`<div class="sum-row" style="border:0;padding-top:0"><span class="dim">Balance on arrival</span><span class="dim">${fmtC(total-dep)}</span></div>`:''}
    <button class="btn solid big-btn" style="margin-top:18px" onclick="guestConfirm()">${G.pay==='onsite'?'Reserve the room':'Pay & book'} — ${esc(r.num)} ${esc(r.name)}</button>
    <p style="font-size:11px;color:var(--ink-faint);margin-top:14px">${esc(s.cancellation)}</p>
  </div>`;
}
function guestConfirm(){
  const name=(G.name||'').trim(), email=(G.email||'').trim();
  if(!name){toast('Almost there','Add your name to hold the room.');document.getElementById('g-name').focus();return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Almost there','We need an email to send the confirmation to.');document.getElementById('g-email').focus();return}
  const room=roomById(G.roomId);
  if(!room){toast('Pick a room','Choose a room to continue.');return}
  /* Somebody may have taken these nights while this page sat open. The front
     desk already re-checked at save; the guest page has to as well. */
  if(!nightsAvail(G.roomId,G.ci,G.co)){
    toast('Just taken','Those nights went while you were deciding — here is what is still open.');
    G.roomId=null;renderGuest();return;
  }
  const n=Math.max(1,nights(G.ci,G.co));
  const q=priceStay(room,G.ci,n,G.promo);
  const due=G.pay==='onsite'?0:G.pay==='deposit'?Math.round(q.total*S.settings.depositPct/100):q.total;
  const res=bookingFrom({room,ci:G.ci,co:addDays(G.ci,n),guest:name,email,phone:(G.phone||'').trim(),payment:G.pay,source:'direct',quote:q});
  S.reservations.push(res);postBookingTxns(res);
  save();
  G.confirmed={id:res.id,name,total:q.total,due,roomId:room.id,ci:G.ci,co:res.checkout};
  renderGuest();renderAll();
  if(S.settings.notifs.newBooking)toast('Notification','Owner notified · guest confirmation sent.');
}
function confirmHTML(){
  const c=G.confirmed;const r=roomById(c.roomId);
  return `<div class="g-confirm">
    <div class="micro" style="color:var(--gold)">Booked direct — thank you</div>
    <h1 style="font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);margin-top:12px">See you soon, ${esc(c.name.split(' ')[0])}</h1>
    <div class="ref">${esc(c.id)}</div>
    <p class="dim">${esc(r?r.num:'')} · ${esc(r?r.name:'')} · ${dNice(c.ci)} → ${dNice(c.co)}</p>
    <p class="dim" style="margin-top:6px">${c.due>0?fmtC(c.due)+' charged · confirmation email on its way':'Nothing charged — pay when you arrive. Card held as security.'}</p>
    <p class="gold" style="margin-top:14px;font-size:12px">Booking here instead of an OTA kept ${fmtC(Math.round(c.total*0.12))} with the property. Thank you.</p>
    <button class="btn" style="margin-top:26px" onclick="G=G0();renderGuest()">Book another stay</button>
  </div>`;
}

/* ============ DEMO LOOP (#demo) — self-playing booking walkthrough ============ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let demoRunning=false;
function demoChrome(){
  if(document.getElementById('demoCursor'))return;
  const c=document.createElement('div');c.id='demoCursor';
  c.style.cssText='position:fixed;width:34px;height:34px;border:2px solid var(--gold);border-radius:50%;z-index:500;pointer-events:none;transition:top .7s cubic-bezier(.4,0,.2,1),left .7s cubic-bezier(.4,0,.2,1),opacity .3s;top:-60px;left:-60px;box-shadow:0 0 20px rgba(214,153,0,.5);opacity:0';
  const cap=document.createElement('div');cap.id='demoCap';
  cap.style.cssText='position:fixed;bottom:34px;left:50%;transform:translateX(-50%);z-index:500;background:var(--bg3);border:1px solid var(--gold);color:var(--cream);font-family:var(--disp);font-size:17px;letter-spacing:.14em;padding:12px 30px;pointer-events:none;opacity:0;transition:opacity .4s;text-transform:uppercase;white-space:nowrap';
  document.body.append(c,cap);
}
function demoCap(t){const c=document.getElementById('demoCap');c.style.opacity=0;setTimeout(()=>{c.textContent=t;c.style.opacity=1},300)}
async function moveTo(el){const c=document.getElementById('demoCursor');if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});await sleep(900);const r=el.getBoundingClientRect();c.style.opacity=1;c.style.top=(r.top+r.height/2-17)+'px';c.style.left=(r.left+r.width/2-17)+'px';await sleep(900)}
async function demoPulse(){const c=document.getElementById('demoCursor');c.style.transform='scale(.6)';await sleep(220);c.style.transform='scale(1)';await sleep(400)}
async function demoLoop(){
  if(demoRunning)return;demoRunning=true;demoChrome();setView('guest');
  while(demoRunning){
    G=G0();renderGuest();
    await sleep(1600);
    demoCap('Pick your dates');await moveTo(document.querySelector('.g-bookbar input'));await demoPulse();
    G.ci=addDays(today(),7);G.co=addDays(today(),10);renderGuest();await sleep(1400);
    demoCap('Rooms that are actually open — live inventory');const room=document.querySelector('.g-room');if(!room)break;await moveTo(room);await demoPulse();
    G.roomId=room.getAttribute('onclick').match(/'([^']+)'/)[1];renderGuest();await sleep(400);
    demoCap('One page. All-in price. No fees.');await moveTo(document.getElementById('gSummary'));await sleep(1400);
    demoCap('Your details — thirty seconds');await moveTo(document.getElementById('g-name'));
    G.name='Alex Rivera';G.email='alex@rivera.ca';G.phone='(867) 555-0199';renderGuest();await demoPulse();await sleep(900);
    demoCap('Pay now — or at the property. Their choice.');await moveTo(document.querySelector('.pay-opts'));await sleep(1500);
    demoCap('Booked. No commission. No middleman.');const btn=document.querySelector('.big-btn');await moveTo(btn);await demoPulse();
    const beforeRes=S.reservations.length, beforeTxn=S.txns.length;
    guestConfirm();
    await sleep(5200);
    /* demo bookings don't pollute the book — or the ledger */
    S.reservations.splice(beforeRes);S.txns.splice(beforeTxn);save();renderAll();
  }
}
if(location.hash==='#demo'){window.addEventListener('load',()=>setTimeout(demoLoop,800))}
